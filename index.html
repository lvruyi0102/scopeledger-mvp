<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScopeLedger MVP - Track Scope Changes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { color: #1a365d; }
    form { background: #f7fafc; padding: 1rem; border-radius: 8px; margin: 1rem 0; }
    input, textarea, select, button { width: 100%; padding: 0.5rem; margin: 0.5rem 0; box-sizing: border-box; }
    button { background: #2b6cb0; color: white; border: none; cursor: pointer; }
    button:hover { background: #2c5282; }
    .change { border: 1px solid #e2e8f0; padding: 1rem; margin: 0.5rem 0; border-radius: 4px; }
    .overdue { border-left: 4px solid #e53e3e; }
    .due-soon { border-left: 4px solid #dd6b20; }
  </style>
</head>
<body>
  <h1>ScopeLedger MVP</h1>
  <p>Local-first tool to log scope changes, track notice deadlines, and generate change-order drafts. Data stays in your browser (localStorage).</p>

  <form id="changeForm">
    <input type="text" id="title" placeholder="Change title (e.g., Added electrical outlets)" required>
    <textarea id="description" placeholder="Description of the change / field direction" rows="3"></textarea>
    <input type="number" id="value" placeholder="Estimated value (CNY or local currency)" step="0.01">
    <input type="date" id="deadline" placeholder="Notice deadline">
    <select id="status">
      <option value="logged">Logged</option>
      <option value="notice-sent">Notice Sent</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
    </select>
    <button type="submit">Add Change</button>
  </form>

  <h2>Open Changes</h2>
  <div id="changesList"></div>

  <h2>Generate Notice Draft</h2>
  <button id="generateNotice">Generate Sample Notice for Selected</button>
  <pre id="noticeOutput" style="background:#edf2f7; padding:1rem; white-space:pre-wrap;"></pre>

  <script>
    const form = document.getElementById('changeForm');
    const list = document.getElementById('changesList');
    const noticeBtn = document.getElementById('generateNotice');
    const noticeOut = document.getElementById('noticeOutput');

    function loadChanges() {
      return JSON.parse(localStorage.getItem('scopeledger-changes') || '[]');
    }

    function saveChanges(changes) {
      localStorage.setItem('scopeledger-changes', JSON.stringify(changes));
      render();
    }

    function render() {
      const changes = loadChanges();
      list.innerHTML = '';
      const today = new Date().toISOString().split('T')[0];
      changes.forEach((c, i) => {
        const div = document.createElement('div');
        div.className = 'change';
        if (c.deadline && c.deadline < today && c.status !== 'approved') div.classList.add('overdue');
        else if (c.deadline && c.deadline <= new Date(Date.now() + 7*86400000).toISOString().split('T')[0]) div.classList.add('due-soon');
        div.innerHTML = `
          <strong>${c.title}</strong> (${c.status}) - Value: ${c.value || 'N/A'}<br>
          Deadline: ${c.deadline || 'None'}<br>
          ${c.description || ''}<br>
          <button onclick="removeChange(${i})">Remove</button>
        `;
        list.appendChild(div);
      });
    }

    function removeChange(i) {
      const changes = loadChanges();
      changes.splice(i, 1);
      saveChanges(changes);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const changes = loadChanges();
      changes.push({
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        value: document.getElementById('value').value,
        deadline: document.getElementById('deadline').value,
        status: document.getElementById('status').value,
        created: new Date().toISOString()
      });
      saveChanges(changes);
      form.reset();
    });

    noticeBtn.addEventListener('click', () => {
      const changes = loadChanges().filter(c => c.status !== 'approved');
      if (!changes.length) {
        noticeOut.textContent = 'No open changes to notice.';
        return;
      }
      const draft = `CHANGE ORDER NOTICE DRAFT\n\nDate: ${new Date().toLocaleDateString()}\n\nSubject: Notice of Additional Work / Scope Change\n\nThe following changes have been directed and require formal notice:\n\n${changes.map((c, i) => `${i+1}. ${c.title}\n   Description: ${c.description}\n   Estimated Value: ${c.value || 'TBD'}\n   Notice Deadline: ${c.deadline || 'Immediate'}\n`).join('\n')}\n\nPlease acknowledge and process within contractual timelines.\n\nThis is a draft generated by ScopeLedger MVP. Review before sending.`;
      noticeOut.textContent = draft;
    });

    render();
  </script>
</body>
</html>
